name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: jpacmloqsfiebvagfomt
      # ─── NO_JWT_FUNCTIONS ───────────────────────────────────────
      # Functions invocadas INTERNAMENTE entre edge functions usando
      # X-Internal-Token (INTERNAL_DISPATCH_TOKEN env var) em vez de
      # JWT padrão do Supabase. Lista mantida aqui pra evitar que o CLI
      # default (verify_jwt=true) reverta o bypass em redeploys.
      # Bug histórico: JWT do SERVICE_ROLE_KEY rejeitado pelo gateway,
      # ver DIAGNOSTICO_ANA.md. Adicionar uma function aqui = ela passa
      # a depender de INTERNAL_DISPATCH_TOKEN. Não esquece de validar
      # o header no STEP 0 do handler dela.
      # instagram-webhook e ml-webhook recebem do Meta (sem JWT Supabase) → --no-verify-jwt;
      # protegem-se por hub.verify_token (GET) + assinatura HMAC do Meta, não por INTERNAL_DISPATCH_TOKEN.
      NO_JWT_FUNCTIONS: "process-message escalate ml-webhook instagram-webhook"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Detect changed paths
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^ HEAD -- 'supabase/functions/' || git diff --name-only HEAD -- 'supabase/functions/')
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -qE '^supabase/functions/_shared/'; then
            echo "deploy_all=true" >> "$GITHUB_OUTPUT"
          else
            functions=$(echo "$changed" | sed -nE 's|^supabase/functions/([^/]+)/.*|\1|p' | sort -u | grep -v '^_shared$' || true)
            echo "functions<<EOF" >> "$GITHUB_OUTPUT"
            echo "$functions" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "deploy_all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy all functions (shared code changed)
        if: steps.detect.outputs.deploy_all == 'true'
        run: |
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            echo "::group::Deploying $name"
            if echo " $NO_JWT_FUNCTIONS " | grep -q " $name "; then
              echo "  -> $name está em NO_JWT_FUNCTIONS, usando --no-verify-jwt"
              supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            else
              supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF"
            fi
            echo "::endgroup::"
          done

      - name: Deploy changed functions only
        if: steps.detect.outputs.deploy_all == 'false' && steps.detect.outputs.functions != ''
        run: |
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            echo "::group::Deploying $name"
            if echo " $NO_JWT_FUNCTIONS " | grep -q " $name "; then
              echo "  -> $name está em NO_JWT_FUNCTIONS, usando --no-verify-jwt"
              supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            else
              supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF"
            fi
            echo "::endgroup::"
          done <<< "${{ steps.detect.outputs.functions }}"
