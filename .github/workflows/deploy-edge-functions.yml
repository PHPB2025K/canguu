name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Nomes das funções, separados por espaço; deploy global desabilitado'
        required: true
        type: string

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: jpacmloqsfiebvagfomt
      # ─── NO_JWT_FUNCTIONS ───────────────────────────────────────
      # Functions invocadas INTERNAMENTE entre edge functions usando
      # X-Internal-Token (INTERNAL_DISPATCH_TOKEN env var) em vez de
      # JWT padrão do Supabase. Lista mantida aqui pra evitar que o CLI
      # default (verify_jwt=true) reverta o bypass em redeploys.
      # Bug histórico: JWT do SERVICE_ROLE_KEY rejeitado pelo gateway,
      # ver DIAGNOSTICO_ANA.md. Adicionar uma function aqui = ela passa
      # a depender de INTERNAL_DISPATCH_TOKEN. Não esquece de validar
      # o header no STEP 0 do handler dela.
      # instagram-webhook, whatsapp-cloud-webhook e ml-webhook recebem do Meta (sem JWT Supabase) → --no-verify-jwt;
      # protegem-se por hub.verify_token (GET) + assinatura HMAC do Meta, não por INTERNAL_DISPATCH_TOKEN.
      NO_JWT_FUNCTIONS: "process-message escalate ml-webhook instagram-webhook instagram-token-refresh instagram-ad-comments-poll escalate-notify whatsapp-cloud-webhook fx-rate-update classify-pending-sentiment sync-product-embedding"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Detect changed paths
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          MANUAL_FUNCTIONS: ${{ inputs.functions }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            functions=$(printf '%s\n' "$MANUAL_FUNCTIONS" | tr ' ' '\n')
          else
            functions=$(python3 scripts/affected-edge-functions.py "$BEFORE" "$AFTER")
          fi
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            [[ "$name" =~ ^[a-z0-9-]+$ ]] && [ -f "supabase/functions/$name/index.ts" ] || exit 1
          done <<< "$functions"
          echo "functions<<EOF" >> "$GITHUB_OUTPUT"
          echo "$functions" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Deploy changed functions only
        if: steps.detect.outputs.functions != ''
        run: |
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            echo "::group::Deploying $name"
            if echo " $NO_JWT_FUNCTIONS " | grep -q " $name "; then
              echo "  -> $name está em NO_JWT_FUNCTIONS, usando --no-verify-jwt"
              supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            else
              supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF"
            fi
            echo "::endgroup::"
          done <<< "${{ steps.detect.outputs.functions }}"
